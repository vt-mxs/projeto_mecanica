services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:6173"

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: