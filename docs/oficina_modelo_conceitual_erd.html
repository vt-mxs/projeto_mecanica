<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
#erd svg.erDiagram text,
#erd svg.erDiagram tspan { fill: #111110 !important; font-weight: 600 !important; }
#erd svg.erDiagram .entityBox { fill: #e9e7de !important; }
#erd svg.erDiagram .attributeBoxOdd { fill: #f4f3ee !important; }
#erd svg.erDiagram .attributeBoxEven { fill: #e3e1d7 !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: false,
    fontSize: '14px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: '#55544f',
    textColor: '#111110',
    primaryTextColor: '#111110',
    nodeTextColor: '#111110',
    attributeBackgroundColorOdd: '#f4f3ee',
    attributeBackgroundColorEven: '#e3e1d7',
    primaryColor: '#e9e7de',
    primaryBorderColor: '#55544f',
  },
});
const src = `erDiagram
  CLIENTE ||--o{ VEICULO : possui
  CLIENTE ||--o{ AGENDAMENTO : agenda
  VEICULO ||--o{ AGENDAMENTO : agendado_para
  CLIENTE ||--o{ ATENDIMENTO : solicita
  VEICULO ||--o{ ATENDIMENTO : eh_atendido
  AGENDAMENTO |o--o| ATENDIMENTO : origina
  USUARIO ||--o{ ATENDIMENTO : registra_excecao
  ATENDIMENTO ||--o{ VERSAO_ORCAMENTO : possui
  USUARIO ||--o{ VERSAO_ORCAMENTO : cria
  VERSAO_ORCAMENTO ||--o{ ITEM_ORCAMENTO : contem
  ITEM_ORCAMENTO ||--o{ ALTERACAO_ORCAMENTO : sofre
  ITEM_ORCAMENTO |o--o{ ALTERACAO_ORCAMENTO : gera_novo_item
  USUARIO ||--o{ ALTERACAO_ORCAMENTO : registra
  ATENDIMENTO ||--o{ ITEM_EXECUTADO : executa
  ITEM_ORCAMENTO |o--o{ ITEM_EXECUTADO : corresponde_a
  ATENDIMENTO ||--o{ PAGAMENTO : recebe
  USUARIO ||--o{ PAGAMENTO : registra

  USUARIO {
    uuid id PK
    string login UK
    string senha
    string perfil
  }
  CLIENTE {
    uuid id PK
    string nome
    string telefone
  }
  VEICULO {
    uuid id PK
    uuid cliente_id FK
    string modelo
    string cor
    string placa UK
    int ano
    bigint km
  }
  AGENDAMENTO {
    uuid id PK
    uuid cliente_id FK
    uuid veiculo_id FK
    datetime data_hora
    string status
  }
  ATENDIMENTO {
    uuid id PK
    uuid cliente_id FK
    uuid veiculo_id FK
    uuid agendamento_id FK
    string problema_relatado
    string avaliacao
    string diagnostico
    datetime execucao_inicio
    datetime execucao_fim
    boolean execucao_interrompida
    string execucao_obs
    datetime entrega_data
    boolean entrega_excecao
    string entrega_excecao_obs
    uuid entrega_excecao_usuario_id FK
  }
  VERSAO_ORCAMENTO {
    uuid id PK
    uuid atendimento_id FK
    int numero_versao
    datetime criado_em
    uuid criado_por_usuario_id FK
  }
  ITEM_ORCAMENTO {
    uuid id PK
    uuid versao_orcamento_id FK
    string tipo
    string descricao
    decimal valor
    string status_aprovacao
  }
  ALTERACAO_ORCAMENTO {
    uuid id PK
    uuid item_orcamento_id FK
    uuid novo_item_orcamento_id FK
    decimal valor_anterior
    decimal valor_novo
    string motivo
    uuid usuario_id FK
    datetime criado_em
    string decisao_status
    datetime decisao_em
  }
  ITEM_EXECUTADO {
    uuid id PK
    uuid atendimento_id FK
    uuid item_orcamento_id FK
    string tipo
    string descricao
    decimal valor_cobrado
    decimal custo_oficina
  }
  PAGAMENTO {
    uuid id PK
    uuid atendimento_id FK
    decimal valor
    string forma_pagamento
    datetime data
    uuid usuario_id FK
    string status
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
