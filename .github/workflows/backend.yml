name: Backend CI

on:
  pull_request:
    paths: 
      - "backend/**"

  push:
    branches: 
    - main
    - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run: 
        working-directory: backend
    
    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GO
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      
      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...
